name: Build & Release BenchFlow

# ─────────────────────────────────────────────────────────────────────────────
# Trigger rules
#   push → main      build both platforms, upload as workflow artifacts (30 days)
#   push → v*.*.*    build + create GitHub Release with DMG + ZIP + checksums
#   pull_request     build only (no upload) to verify nothing is broken
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    tags:     ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Required to create GitHub Releases and upload assets
permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── Read version number ────────────────────────────────────────────────────
  version:
    name: 📌 Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag:     ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          VER=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VER"   >> $GITHUB_OUTPUT
          echo "tag=v$VER"      >> $GITHUB_OUTPUT
          echo "Building version: v$VER"

  # ── macOS build ────────────────────────────────────────────────────────────
  build-macos:
    name: 🍎 macOS build
    needs: version
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build BenchFlow.app
        run: |
          mkdir -p dist/mac
          python -m PyInstaller --noconfirm \
            --distpath dist/mac \
            --workpath build \
            BenchFlow.spec

      - name: Verify .app
        run: |
          test -d dist/mac/BenchFlow.app
          echo "✓ BenchFlow.app OK  ($(du -sh dist/mac/BenchFlow.app | cut -f1))"

      - name: Create DMG
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          DMG="dist/mac/BenchFlow-v${VERSION}-macOS.dmg"

          # 1. Give the OS a moment to release any file handles on the freshly
          #    built .app before we try to image it.
          sleep 5

          # 2. Stage into a dedicated temp folder (avoids "Resource busy" on the
          #    live dist/mac/ directory that PyInstaller may still have open).
          rm -rf release_temp
          mkdir -p release_temp
          cp -R dist/mac/BenchFlow.app release_temp/

          # 3. Strip Finder / quarantine extended attributes that can cause
          #    hdiutil to fail with "Resource busy" or metadata errors.
          xattr -cr release_temp/BenchFlow.app || true

          # 4. Create the DMG from the clean staging folder.
          hdiutil create \
            -volname "BenchFlow" \
            -srcfolder release_temp \
            -ov -format UDZO \
            "$DMG"

          # 5. Clean up staging folder.
          rm -rf release_temp

          echo "DMG_PATH=$DMG" >> $GITHUB_ENV
          echo "DMG_NAME=BenchFlow-v${VERSION}-macOS.dmg" >> $GITHUB_ENV
          echo "✓ DMG: $(du -sh $DMG | cut -f1)"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BenchFlow-macOS
          path: dist/mac/BenchFlow-v*-macOS.dmg
          retention-days: 30
          if-no-files-found: error

  # ── Windows build ──────────────────────────────────────────────────────────
  build-windows:
    name: 🪟 Windows build
    needs: version
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate AppIcon.ico
        run: |
          python -c "
          from PIL import Image
          img = Image.open('AppIcon.icns')
          img.save('AppIcon.ico', format='ICO',
                   sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])
          print('AppIcon.ico generated')
          "

      - name: Build BenchFlow.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows | Out-Null
          python -m PyInstaller --noconfirm `
            --distpath dist\windows `
            --workpath build `
            BenchFlow_windows.spec

      - name: Verify .exe
        shell: pwsh
        run: |
          $exe = "dist\windows\BenchFlow\BenchFlow.exe"
          if (-not (Test-Path $exe)) { throw "BenchFlow.exe not found" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host ("✓ BenchFlow.exe  ({0:F1} MB)" -f $size)

      - name: Create ZIP
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ZIP = "dist\windows\BenchFlow-v${env:VERSION}-Windows.zip"
          Compress-Archive -Path "dist\windows\BenchFlow\*" `
                           -DestinationPath $ZIP -Force
          $sizeMB = (Get-Item $ZIP).Length / 1MB
          Write-Host ("✓ ZIP: {0:F1} MB" -f $sizeMB)

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BenchFlow-Windows
          path: dist\windows\BenchFlow-v*-Windows.zip
          retention-days: 30
          if-no-files-found: error

  # ── GitHub Release (tag pushes only) ──────────────────────────────────────
  release:
    name: 🚀 GitHub Release
    needs: [version, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: BenchFlow-macOS
          path: release-assets/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: BenchFlow-Windows
          path: release-assets/

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum BenchFlow-*.dmg BenchFlow-*.zip > checksums.txt
          echo "── checksums ──"
          cat checksums.txt

      - name: List release assets
        run: ls -lh release-assets/

      - name: Extract changelog section
        id: changelog
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          python3 - <<'EOF'
          import re, os, pathlib

          tag = os.environ["TAG"]
          text = pathlib.Path("CHANGELOG.md").read_text()

          # Match the section for this version
          pattern = rf"## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          m = re.search(pattern, text, re.DOTALL)
          notes = m.group(1).strip() if m else "See CHANGELOG.md for details."

          # Write to file so the next step can read it
          pathlib.Path("release_notes.md").write_text(notes)
          print(notes)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BenchFlow ${{ needs.version.outputs.tag }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          files: |
            release-assets/BenchFlow-*.dmg
            release-assets/BenchFlow-*.zip
            release-assets/checksums.txt
