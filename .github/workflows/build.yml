name: Build & Release BenchFlow Qt

# ─────────────────────────────────────────────────────────────────────────────
# Trigger rules
#   push → main      build both platforms + create/update GitHub Release
#   push → v*.*.*    same (tag push also triggers a release)
#   pull_request     build only — no release — just verify nothing breaks
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    tags:     ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Required to create GitHub Releases and upload assets
permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── Read version number ────────────────────────────────────────────────────
  version:
    name: 📌 Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag:     ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          VER=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VER"   >> $GITHUB_OUTPUT
          echo "tag=v$VER"      >> $GITHUB_OUTPUT
          echo "Building version: v$VER"

  # ── macOS build ────────────────────────────────────────────────────────────
  build-macos:
    name: 🍎 macOS Qt build
    needs: version
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Qt dependencies
        run: pip install -r requirements_qt.txt

      - name: Build BenchFlow.app (Qt / PySide6)
        run: |
          mkdir -p dist/mac_qt
          python -m PyInstaller --noconfirm \
            --distpath dist/mac_qt \
            --workpath build \
            BenchFlow_Qt.spec

      - name: Verify .app
        run: |
          test -d dist/mac_qt/BenchFlow.app
          echo "✓ BenchFlow.app OK  ($(du -sh dist/mac_qt/BenchFlow.app | cut -f1))"

      - name: Create DMG
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          DMG="dist/mac_qt/BenchFlow-Qt-v${VERSION}-macOS.dmg"

          # Stage into a temp folder to avoid "Resource busy" on dist/mac_qt/
          rm -rf release_temp
          mkdir -p release_temp
          cp -R dist/mac_qt/BenchFlow.app release_temp/

          # Strip extended attributes that can cause hdiutil to fail
          xattr -cr release_temp/BenchFlow.app || true

          hdiutil create \
            -volname "BenchFlow Qt" \
            -srcfolder release_temp \
            -ov -format UDZO \
            "$DMG"

          rm -rf release_temp

          echo "DMG_PATH=$DMG" >> $GITHUB_ENV
          echo "DMG_NAME=BenchFlow-Qt-v${VERSION}-macOS.dmg" >> $GITHUB_ENV
          echo "✓ DMG: $(du -sh $DMG | cut -f1)"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BenchFlow-Qt-macOS
          path: dist/mac_qt/BenchFlow-Qt-v*-macOS.dmg
          retention-days: 30
          if-no-files-found: error

  # ── Windows build ──────────────────────────────────────────────────────────
  build-windows:
    name: 🪟 Windows Qt build
    needs: version
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Qt dependencies
        run: pip install -r requirements_qt.txt

      - name: Generate AppIcon.ico from AppIcon.icns
        run: |
          python -c "
          try:
              from PIL import Image
              img = Image.open('AppIcon.icns')
              img.save('AppIcon.ico', format='ICO',
                       sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])
              print('AppIcon.ico generated')
          except Exception as e:
              print(f'Icon generation skipped: {e}')
          "

      - name: Build BenchFlow_Qt.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\win_qt | Out-Null
          python -m PyInstaller --noconfirm `
            --distpath dist\win_qt `
            --workpath build `
            BenchFlow_Qt.spec

      - name: Verify .exe
        shell: pwsh
        run: |
          $exe = "dist\win_qt\BenchFlow_Qt\BenchFlow_Qt.exe"
          if (-not (Test-Path $exe)) { throw "BenchFlow_Qt.exe not found" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host ("✓ BenchFlow_Qt.exe  ({0:F1} MB)" -f $size)

      - name: Create ZIP
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ZIP = "dist\win_qt\BenchFlow-Qt-v${env:VERSION}-Windows.zip"
          Compress-Archive -Path "dist\win_qt\BenchFlow_Qt\*" `
                           -DestinationPath $ZIP -Force
          $sizeMB = (Get-Item $ZIP).Length / 1MB
          Write-Host ("✓ ZIP: {0:F1} MB" -f $sizeMB)

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BenchFlow-Qt-Windows
          path: dist\win_qt\BenchFlow-Qt-v*-Windows.zip
          retention-days: 30
          if-no-files-found: error

  # ── GitHub Release (every push to main + tag pushes) ─────────────────────
  release:
    name: 🚀 GitHub Release
    needs: [version, build-macos, build-windows]
    runs-on: ubuntu-latest
    # Run on any push event (main branch or tag) — skip pull_request builds.
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: BenchFlow-Qt-macOS
          path: release-assets/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: BenchFlow-Qt-Windows
          path: release-assets/

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum BenchFlow-Qt-*.dmg BenchFlow-Qt-*.zip > checksums.txt
          echo "── checksums ──"
          cat checksums.txt

      - name: List release assets
        run: ls -lh release-assets/

      - name: Extract changelog section
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          python3 - <<'EOF'
          import re, os, pathlib

          tag = os.environ["TAG"]
          text = pathlib.Path("CHANGELOG.md").read_text()

          # Match the section for this version
          pattern = rf"## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          m = re.search(pattern, text, re.DOTALL)
          notes = m.group(1).strip() if m else "See CHANGELOG.md for details."

          pathlib.Path("release_notes.md").write_text(notes)
          print(notes)
          EOF

      - name: Delete existing release and tag (if any)
        # Ensures a clean slate so re-pushing main always updates the release
        # with the latest assets.  --cleanup-tag also removes the git tag so
        # the next step can create it fresh.  "|| true" silences errors when
        # no release exists yet.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          sleep 2

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG:     ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          PRERELEASE=""
          # Treat versions containing a hyphen (e.g. 1.0.0-beta) as pre-releases
          if echo "$VERSION" | grep -q '-'; then
            PRERELEASE="--prerelease"
          fi

          gh release create "$TAG" \
            --title "BenchFlow Qt $TAG" \
            --notes-file release_notes.md \
            --latest \
            $PRERELEASE \
            release-assets/BenchFlow-Qt-*.dmg \
            release-assets/BenchFlow-Qt-*.zip \
            release-assets/checksums.txt

          echo "✓ Release $TAG published"
